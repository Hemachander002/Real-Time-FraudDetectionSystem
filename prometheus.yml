global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "fraud-inference"
    static_configs:
      - targets: ["host.docker.internal:18000"]

  - job_name: "fraud-transactions"
    static_configs:
      - targets: ["host.docker.internal:8001"]

  - job_name: "fraud-kafka-producer"
    static_configs:
      - targets: ["host.docker.internal:8002"]

